# MATH 316 teaching materials: one optional illustration per chapter.
# A lecture with no pdf field displays 'Notes forthcoming'.
# Add image/image_alt at the chapter level when illustrations are ready.
units:
  - number: 1
    title: "First-order differential equations"
    short_title: "First order"
    summary: "First-order solution techniques, direction fields, equilibrium behavior, and mathematical models."
    lectures:
      - number: "1.1"
        title: "Introduction to first-order differential equations"
        description: "What differential equations model and how first-order equations are classified."
        pdf: "/files/Math316/1.1-first-order.pdf"
      - number: "1.2"
        title: "Solutions and direction fields"
        description: "Understanding solution curves and the information contained in direction fields."
        pdf: "/files/Math316/1.2-solutions.pdf"
      - number: "1.3"
        title: "Separation of variables"
        description: "Solving separable equations by integrating functions of one variable."
        pdf: "/files/Math316/1.3-separation.pdf"
      - number: "1.4"
        title: "Linear equations and integrating factors"
        description: "Solving linear first-order equations using an integrating factor."
        pdf: "/files/Math316/1.4-linear-equations.pdf"
      - number: "1.5"
        title: "Applications of first-order equations"
        description: "Building and interpreting mathematical models from first-order equations."
        pdf: "/files/Math316/1.5-applications.pdf"
      - number: "1.6"
        title: "Autonomous equations and stability"
        description: "Finding equilibria and classifying stability in autonomous equations."
        pdf: "/files/Math316/1.6-autonomous.pdf"
      - number: "1.7"
        title: "Population models"
        description: "Using differential equations to model population growth and competition."
        pdf: "/files/Math316/1.7-population.pdf"
      - number: "1.8"
        title: "Existence and uniqueness"
        description: "Determining when an initial-value problem has a unique local solution."
        pdf: "/files/Math316/1.8-existence-uniqueness.pdf"
  - number: 2
    title: "Second-order linear differential equations"
    short_title: "Second order"
    summary: "Characteristic equations, forced and unforced oscillations, and spring–mass systems."
    lectures:
      - number: "2.1"
        title: "Spring–mass models"
        description: "Deriving a differential-equation model for spring–mass motion."
        pdf: "/files/Math316/2.1-spring-model.pdf"
      - number: "2.2"
        title: "Distinct real characteristic roots"
        description: "Solving homogeneous equations with distinct real characteristic roots."
        pdf: "/files/Math316/2.2-distinct-roots.pdf"
      - number: "2.3"
        title: "Repeated characteristic roots"
        description: "Solving homogeneous equations with repeated characteristic roots."
        pdf: "/files/Math316/2.3-repeated-roots.pdf"
      - number: "2.4"
        title: "Complex characteristic roots"
        description: "Interpreting complex roots and oscillatory solutions."
        pdf: "/files/Math316/2.4-complex-roots.pdf"
      - number: "2.5"
        title: "Unforced spring–mass systems"
        description: "Classifying undamped, underdamped, critically damped, and overdamped motion."
        pdf: "/files/Math316/2.5-unforced-spings.pdf"
      - number: "2.6"
        title: "Method of undetermined coefficients"
        description: "Finding particular solutions by the method of undetermined coefficients."
        pdf: "/files/Math316/2.6-mouc.pdf"
      - number: "2.7"
        title: "Forced spring–mass systems"
        description: "Analyzing forced oscillations, beats, and resonance."
        pdf: "/files/Math316/2.7-forced-springs.pdf"
  - number: 3
    title: "Laplace transforms"
    short_title: "Laplace transforms"
    summary: "Transforms of elementary functions, initial-value problems, step functions, and impulses."
    lectures:
      - number: "3.1"
        title: "Definition and basic properties of the Laplace transform"
        description: "Introducing the Laplace integral transform and its basic properties."
        pdf: "/files/Math316/3.1-definition.pdf"
      - number: "3.2"
        title: "Solving initial-value problems"
        description: "Solving initial-value problems with Laplace transforms."
        pdf: "/files/Math316/3.2-solving-ivps.pdf"
      - number: "3.3"
        title: "Shift theorems"
        description: "Applying first and second shifting properties."
        pdf: "/files/Math316/3.3-shift.pdf"
      - number: "3.4"
        title: "Heaviside step function"
        description: "Representing discontinuous inputs using the Heaviside step function."
        pdf: "/files/Math316/3.4-heaviside.pdf"
      - number: "3.5"
        title: "Piecewise forcing"
        description: "Modeling piecewise forcing functions and solving the resulting equations."
        pdf: "/files/Math316/3.5-pw-forcing.pdf"
      - number: "3.6"
        title: "Impulse forces"
        description: "Understanding impulse forcing and its effect on solutions."
        pdf: "/files/Math316/3.6-impulse.pdf"
  - number: 4
    title: "Linear systems of differential equations"
    short_title: "Linear systems"
    summary: "Matrix methods, eigenvalues and eigenvectors, and the geometry of two-dimensional phase portraits."
    lectures:
      - title: "Matrix formulation and eigenvectors"
        description: "Representing first-order systems in matrix form and computing eigensolutions."
      - title: "Phase portraits and stability"
        description: "Sketching saddle, node, spiral, and center trajectories."
      - title: "Repeated and zero eigenvalues"
        description: "Analyzing special eigenvalue cases in linear systems."
  - number: 5
    title: "Nonlinear systems and applications"
    short_title: "Nonlinear systems"
    summary: "Equilibria, linearization, and nonlinear models such as predator–prey dynamics."
    lectures:
      - title: "From higher-order equations to systems"
        description: "Rewriting scalar differential equations as first-order systems."
      - title: "Equilibria and linearization"
        description: "Understanding local dynamics near stationary points."
      - title: "Competing species and predator–prey models"
        description: "Studying interacting populations using nonlinear models."
      - title: "Nonlinear pendulum"
        description: "Examining nonlinear motion and phase portraits."
