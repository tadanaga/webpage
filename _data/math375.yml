# MATH/CS 375 curriculum and lecture cards.
# Descriptions can be edited independently of the page layout.
# To add an image later, add the following fields to any lecture:
#   image: "/images/Math375/lecture00.png"
#   image_alt: "An informative description of the illustration"
# Image size and placement can be refined once artwork is available.
units:
  - number: 1
    title: "Foundations of numerical computing"
    short_title: "Foundations"
    lectures:
      - number: "00"
        title: "Course introduction"
        description: "An overview of the course and the role of computation in numerical mathematics."
        pdf: "/files/Math375/lecture00.pdf"
      - number: "01"
        title: "Taylor series and convergence"
        description: "Using Taylor expansions to study approximations and convergence."
        pdf: "/files/Math375/lecture01.pdf"
      - number: "02A"
        title: "Introduction to floating-point numbers"
        description: "How real numbers are represented with finite-precision floating-point numbers."
        pdf: "/files/Math375/lecture02a.pdf"
      - number: "02B"
        title: "Floating-point arithmetic (continued)"
        description: "How rounding affects computations and the accuracy of numerical results."
        pdf: "/files/Math375/lecture02b.pdf"
  - number: 2
    title: "Numerical differentiation and nonlinear equations"
    short_title: "Nonlinear equations"
    lectures:
      - number: "03A"
        title: "Numerical differentiation"
        description: "Approximating derivatives numerically and understanding sources of error."
        pdf: "/files/Math375/lecture03a.pdf"
      - number: "03B"
        title: "Extrapolation"
        description: "Using extrapolation to improve the accuracy of numerical approximations."
        pdf: "/files/Math375/lecture03b.pdf"
      - number: "04A"
        title: "Nonlinear equations and the bisection method"
        description: "Finding solutions of nonlinear equations with bracket-based methods."
        pdf: "/files/Math375/lecture04a.pdf"
      - number: "04B"
        title: "Nonlinear equations (continued)"
        description: "Developing and comparing numerical strategies for finding roots."
        pdf: "/files/Math375/lecture04b.pdf"
      - number: "04C"
        title: "Secant method"
        description: "Using the secant method to approximate roots without derivatives."
        pdf: "/files/Math375/lecture04c.pdf"
  - number: 3
    title: "Numerical linear algebra and linear systems"
    short_title: "Linear systems"
    lectures:
      - number: "05A"
        title: "Linear algebra fundamentals"
        description: "Matrix and vector ideas that underlie numerical linear algebra."
        pdf: "/files/Math375/lecture05a.pdf"
      - number: "05B"
        title: "Counting operations and solving special systems"
        description: "Estimating computational cost and using structure to solve special systems."
        pdf: "/files/Math375/lecture05b.pdf"
      - number: "06A"
        title: "Gaussian elimination"
        description: "Solving systems of linear equations using Gaussian elimination."
        pdf: "/files/Math375/lecture06a.pdf"
      - number: "06B"
        title: "Gaussian elimination (continued)"
        description: "Continuing the elimination process and its practical implementation."
        pdf: "/files/Math375/lecture06b.pdf"
      - number: "06C"
        title: "Numerical stability"
        description: "Understanding stability and the effects of rounding in linear systems."
        pdf: "/files/Math375/lecture06c.pdf"
      - number: "07A"
        title: "LU factorization"
        description: "Factoring a matrix into triangular factors for efficient solution methods."
        pdf: "/files/Math375/lecture07a.pdf"
      - number: "07B"
        title: "LDL and Cholesky factorizations"
        description: "Using matrix factorizations for symmetric linear systems."
        pdf: "/files/Math375/lecture07b.pdf"
      - number: "08A"
        title: "Stationary iterative methods"
        description: "Approximating solutions of linear systems using repeated iterations."
        pdf: "/files/Math375/lecture08a.pdf"
      - number: "08B"
        title: "Sparsity and iterative methods"
        description: "Taking advantage of sparse matrices in iterative computations."
        pdf: "/files/Math375/lecture08b.pdf"
      - number: "08C"
        title: "Iterative methods (continued)"
        description: "Further properties and applications of iterative methods."
        pdf: "/files/Math375/lecture08c.pdf"
  - number: 4
    title: "Interpolation and splines"
    short_title: "Interpolation"
    lectures:
      - number: "09A"
        title: "Polynomial interpolation"
        description: "Constructing polynomials that interpolate a given set of data points."
        pdf: "/files/Math375/lecture09a.pdf"
      - number: "09B"
        title: "Newton interpolation"
        description: "Writing interpolating polynomials in Newton form."
        pdf: "/files/Math375/lecture09b.pdf"
      - number: "09C"
        title: "Interpolation error"
        description: "Understanding how interpolation error depends on the data and method."
        pdf: "/files/Math375/lecture09c.pdf"
      - number: "10A"
        title: "Splines"
        description: "Using piecewise polynomials to build smooth interpolants."
        pdf: "/files/Math375/lecture10a.pdf"
      - number: "10B"
        title: "Interpolation, splines, and data visualization in MATLAB"
        description: "Working with interpolation, splines, and three-dimensional data in MATLAB."
        pdf: "/files/Math375/lecture10b.pdf"
  - number: 5
    title: "Numerical integration"
    short_title: "Integration"
    lectures:
      - number: "11A"
        title: "Numerical integration"
        description: "Approximating definite integrals using sampled function values."
        pdf: "/files/Math375/lecture11a.pdf"
      - number: "11B"
        title: "Newton–Cotes formulas"
        description: "Studying numerical integration formulas based on interpolating polynomials."
        pdf: "/files/Math375/lecture11b.pdf"
      - number: "12A"
        title: "Gaussian quadrature"
        description: "Choosing quadrature nodes and weights for greater accuracy."
        pdf: "/files/Math375/lecture12a.pdf"
      - number: "12B"
        title: "Generalized Gaussian quadrature"
        description: "Extending Gaussian quadrature to more general integration settings."
        pdf: "/files/Math375/lecture12b.pdf"
  - number: 6
    title: "Eigenvalue methods and least squares"
    short_title: "Eigenvalues & least squares"
    lectures:
      - number: "13A"
        title: "Power method"
        description: "Using the power method to approximate an eigenvalue and eigenvector."
        pdf: "/files/Math375/lecture13a.pdf"
      - number: "13B"
        title: "Markov chains"
        description: "Studying Markov chains through matrix-based computation."
        pdf: "/files/Math375/lecture13b.pdf"
      - number: "14A"
        title: "Least-squares methods"
        description: "Finding approximate models that fit more data than an exact system can."
        pdf: "/files/Math375/lecture14a.pdf"
      - number: "14B"
        title: "Least squares"
        description: "Solving and interpreting least-squares problems."
        pdf: "/files/Math375/lecture14b.pdf"
  - number: 7
    title: "Differential equations and simulation"
    short_title: "Differential equations"
    lectures:
      - number: "15A"
        title: "Numerical methods for differential equations"
        description: "Approximating solutions to differential equations using numerical methods."
        pdf: "/files/Math375/lecture15a.pdf"
      - number: "15B"
        title: "Numerical methods for differential equations (continued)"
        description: "Exploring further numerical methods for differential equations."
        pdf: "/files/Math375/lecture15b.pdf"
      - number: "15C"
        title: "Runge–Kutta methods"
        description: "Improving solution accuracy with Runge–Kutta time-stepping methods."
        pdf: "/files/Math375/lecture15c.pdf"
      - number: "16"
        title: "Monte Carlo methods"
        description: "Estimating quantities using random sampling and Monte Carlo simulation."
        pdf: "/files/Math375/lecture16.pdf"
