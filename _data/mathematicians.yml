# Selected mathematicians connected to courses in calculus, differential equations,
# and numerical computing. Birth/death years are in the Gregorian calendar where applicable.
# Each entry links to a scholarly biographical reference; add new entries here.
# lane controls the vertical placement of a label in the scrollable overview.
# To hide a person from the site, add under their name: hidden: true
# To add topic links, insert alongside their other fields:
#     links:
#       - label: "A named theorem or mathematical concept"
#         url: "https://en.wikipedia.org/wiki/Example"
# The template automatically displays links and omits hidden people.
mathematicians:
  - id: "descartes"
    name: "René Descartes"
    birth: 1596
    death: 1650
    lane: 0
    topic: "Analytic geometry"
    course: "Calculus III"
    summary: "Descartes helped establish analytic geometry, connecting geometric problems with algebra and coordinates."
    fact: "Descartes published La Géométrie in 1637 as one of three appendices to his Discourse on Method. The work helped connect algebraic equations with geometric curves."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Descartes/"
  - id: "newton"
    name: "Isaac Newton"
    birth: 1643
    death: 1727
    lane: 0
    topic: "Calculus and mechanics"
    course: "Calculus · Differential Equations"
    summary: "Newton developed foundational ideas in calculus and mathematical physics, describing motion and gravitation through mathematical laws."
    fact: "Newton was born on Christmas Day in 1642 according to the calendar then used in England. On the modern Gregorian calendar, his birthday is January 4, 1643."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Newton/"
  - id: "leibniz"
    name: "G. W. Leibniz"
    birth: 1646
    death: 1716
    lane: 1
    topic: "Calculus notation"
    course: "Calculus"
    summary: "Leibniz independently developed calculus and introduced influential notation, including the integral sign and differentials."
    fact: "Leibniz designed an early mechanical calculator in the 1670s, intended to perform multiplication and division as well as addition and subtraction—centuries before electronic computers."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Leibniz/"
  - id: "bernoulli"
    name: "Jacob Bernoulli"
    birth: 1655
    death: 1705
    lane: 2
    topic: "Differential equations and probability"
    course: "Differential Equations"
    summary: "Jacob Bernoulli contributed to early calculus, differential equations, and probability; several members of his family made major mathematical discoveries."
    fact: "Jacob Bernoulli's major probability book, Ars Conjectandi, appeared in 1713, eight years after his death. It included a foundational version of the law of large numbers."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Bernoulli_Jacob/"
  - id: "taylor"
    name: "Brook Taylor"
    birth: 1685
    death: 1731
    lane: 0
    topic: "Taylor series"
    course: "Numerical Computing"
    summary: "Taylor's work on series expansions became central to approximation and the analysis of numerical errors."
    fact: "Brook Taylor was also an accomplished musician and painter. His 1715 book on linear perspective used mathematics to explain vanishing points in drawings."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Taylor/"
  - id: "euler"
    name: "Leonhard Euler"
    birth: 1707
    death: 1783
    lane: 1
    topic: "Analysis and Euler's method"
    course: "Differential Equations · Numerical Computing"
    summary: "Euler made foundational contributions to analysis, mechanics, number theory, and the notation of modern mathematics."
    fact: "Euler continued producing remarkable amounts of mathematics after becoming almost completely blind. Nearly half of his published work came after his return to St Petersburg in 1766."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Euler/"
  - id: "lagrange"
    name: "Joseph-Louis Lagrange"
    birth: 1736
    death: 1813
    lane: 0
    topic: "Interpolation and mechanics"
    course: "Numerical Computing"
    summary: "Lagrange developed ideas in mathematical mechanics and made broad contributions to analysis, approximation, and differential equations."
    fact: "Lagrange originally expected to pursue law and found classical geometry unappealing. Reading Edmund Halley's work on algebra and optics helped spark his interest in mathematics."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Lagrange/"
  - id: "laplace"
    name: "Pierre-Simon Laplace"
    birth: 1749
    death: 1827
    lane: 1
    topic: "Transforms and probability"
    course: "Differential Equations"
    summary: "Laplace advanced celestial mechanics and probability; the integral transform bearing his name is now central to differential equations."
    fact: "Napoleon appointed Laplace minister of the interior in 1799 but dismissed him after only six weeks. Napoleon later joked that Laplace had brought infinitesimal thinking into government."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Laplace/"
  - id: "fourier"
    name: "Joseph Fourier"
    birth: 1768
    death: 1830
    lane: 0
    topic: "Heat flow and series"
    course: "Differential Equations"
    summary: "Fourier studied heat conduction and the representation of functions by sums of trigonometric waves."
    fact: "Before developing his theory of heat conduction, Fourier joined Napoleon's 1798 expedition to Egypt as a scientific adviser and helped establish a scientific institute in Cairo."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Fourier/"
  - id: "germain"
    name: "Sophie Germain"
    birth: 1776
    death: 1831
    lane: 2
    topic: "Elasticity and number theory"
    course: "Differential Equations"
    summary: "Germain made significant contributions to elasticity and number theory despite substantial barriers to formal mathematics education."
    fact: "Sophie Germain wrote to Gauss under the male pseudonym M. LeBlanc. Her identity came to light after she tried to protect him during the French occupation of his hometown."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Germain/"
  - id: "gauss"
    name: "Carl Friedrich Gauss"
    birth: 1777
    death: 1855
    lane: 3
    topic: "Quadrature and least squares"
    course: "Numerical Computing"
    summary: "Gauss worked across number theory, astronomy, statistics, and computational mathematics; Gaussian quadrature and least squares remain fundamental tools."
    fact: "In 1801, Gauss used limited observations to predict where astronomers could find Ceres after it disappeared behind the Sun. His calculation helped recover the newly discovered object."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Gauss/"
  - id: "cauchy"
    name: "Augustin-Louis Cauchy"
    birth: 1789
    death: 1857
    lane: 1
    topic: "Limits and rigorous analysis"
    course: "Calculus · Differential Equations"
    summary: "Cauchy helped make calculus and analysis more systematic, with careful treatments of limits, series, and differential equations."
    fact: "As a child, Cauchy encountered Laplace and Lagrange, who visited his family's home. Lagrange reportedly encouraged his father to emphasize language studies before advanced mathematics."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Cauchy/"
  - id: "green"
    name: "George Green"
    birth: 1793
    death: 1841
    lane: 4
    topic: "Green's theorem and potential theory"
    course: "Calculus III · Differential Equations"
    summary: "Green was a largely self-taught English mathematician whose work introduced Green's theorem and Green's functions, now central to vector calculus and the mathematical study of partial differential equations."
    fact: "While working in his family's flour mill in Nottingham, Green taught himself advanced mathematics. His groundbreaking 1828 essay on electricity and magnetism was privately published with just 51 subscribers."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Green/"
  - id: "jacobi"
    name: "Carl Gustav Jacobi"
    birth: 1804
    death: 1851
    lane: 0
    topic: "Matrix iterations"
    course: "Numerical Computing"
    summary: "Jacobi contributed extensively to analysis and mathematical physics; his name also appears in iterative linear-system solvers."
    fact: "Jacobi advanced so quickly in school that he was academically ready for university at age twelve. Berlin's university would not admit students younger than sixteen."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Jacobi/"
  - id: "lovelace"
    name: "Ada Lovelace"
    birth: 1815
    death: 1852
    lane: 2
    topic: "Algorithms and computing"
    course: "Numerical Computing"
    summary: "Lovelace wrote influential notes about Charles Babbage's proposed Analytical Engine, including an algorithm for computing Bernoulli numbers."
    fact: "Ada Lovelace was the daughter of the poet Lord Byron, whom she never came to know. Her mother encouraged her study of mathematics, and she later wrote influential notes on Babbage's Analytical Engine."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Lovelace/"
  - id: "riemann"
    name: "Bernhard Riemann"
    birth: 1826
    death: 1866
    lane: 1
    topic: "Integration and geometry"
    course: "Calculus III"
    summary: "Riemann reshaped the foundations of integration and geometry, influencing calculus and later mathematical physics."
    fact: "According to a well-known biographical account, Riemann read a 900-page book on number theory by Legendre in just six days while he was still a schoolboy."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Riemann/"
  - id: "heaviside"
    name: "Oliver Heaviside"
    birth: 1850
    death: 1925
    lane: 2
    topic: "Step functions and operational calculus"
    course: "Differential Equations"
    summary: "Heaviside developed operational calculus for analyzing electrical circuits, advanced vector analysis and electromagnetism, and gave his name to the Heaviside step function."
    fact: "Heaviside left school at sixteen and worked as a telegraph operator. Fascinated by Maxwell's theory, he later left his job to study it full-time and helped reformulate Maxwell's original system into the four vector equations familiar today."
    links:
      - label: "Heaviside step function"
        url: "https://en.wikipedia.org/wiki/Heaviside_step_function"
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Heaviside/"
  - id: "runge"
    name: "Carl Runge"
    birth: 1856
    death: 1927
    lane: 0
    topic: "Numerical differential equations"
    course: "Numerical Computing"
    summary: "Runge developed numerical and graphical approaches to mathematics and helped shape methods for solving differential equations."
    fact: "Runge spent his early childhood in Havana and grew up speaking English at home. At university he became a close friend of Max Planck, the future pioneer of quantum theory."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Runge/"
  - id: "markov"
    name: "Andrey Markov"
    birth: 1856
    death: 1922
    lane: 3
    topic: "Markov chains and probability inequalities"
    course: "Numerical Computing"
    summary: "Markov pioneered the study of sequences of dependent random variables, now known as Markov chains. Markov's inequality also gives an upper bound on the probability of a large value using only a nonnegative random variable's expected value."
    fact: "In 1913, Markov analyzed 20,000 letters from Pushkin's Eugene Onegin, recording how often vowels and consonants followed one another. It became a famous early demonstration of Markov chains."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Markov/"
  - id: "kutta"
    name: "Wilhelm Kutta"
    birth: 1867
    death: 1944
    lane: 1
    topic: "Runge–Kutta methods"
    course: "Numerical Computing"
    summary: "Kutta advanced numerical methods for ordinary differential equations; his name survives in Runge–Kutta schemes."
    fact: "Kutta developed an influential numerical method for differential equations in his 1900 doctoral thesis. He later studied aerodynamics, including the mathematical description of lift on aircraft wings."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Kutta/"
  - id: "noether"
    name: "Emmy Noether"
    birth: 1882
    death: 1935
    lane: 2
    topic: "Symmetry and conservation"
    course: "Differential Equations"
    summary: "Noether transformed modern algebra and uncovered a fundamental relationship between continuous symmetries and conservation laws."
    fact: "Before Emmy Noether received permission to teach officially at Göttingen in 1919, David Hilbert advertised some of her mathematics courses under his own name."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Noether_Emmy/"
  - id: "turing"
    name: "Alan Turing"
    birth: 1912
    death: 1954
    lane: 0
    topic: "The foundations of computation"
    course: "Numerical Computing"
    summary: "Turing helped establish the theoretical foundations of computation and contributed to wartime codebreaking."
    fact: "During Britain's 1926 General Strike, fourteen-year-old Alan Turing reportedly cycled about sixty miles to get to school when normal transport was disrupted."
    source: "https://mathshistory.st-andrews.ac.uk/Biographies/Turing/"
